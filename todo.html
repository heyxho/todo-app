<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>任务清单管理 - 时间管理四象限</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .tab:hover {
            transform: translateY(-2px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .quadrant-view {
            display: none;
        }

        .quadrant-view.active {
            display: block;
        }

        .list-view {
            display: grid;
        }

        .list-view.hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .quadrant-grid {
                grid-template-columns: 1fr !important;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 25px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            box-shadow: 0 5px 20px rgba(108, 117, 141, 0.4);
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-row input,
        .filter-row select {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-item .number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-item .label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .task-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .task-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid;
            cursor: grab;
        }

        .task-item:active {
            cursor: grabbing;
            transform: scale(1.02);
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .task-item.important-high {
            border-left-color: #dc3545;
        }

        .task-item.important-medium {
            border-left-color: #ffc107;
        }

        .task-item.important-low {
            border-left-color: #28a745;
        }

        .task-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .task-priority {
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.8rem;
            color: white;
        }

        .priority-high {
            background: #dc3545;
        }

        .priority-medium {
            background: #ffc107;
            color: #333 !important;
        }

        .priority-low {
            background: #28a745;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .task-meta i {
            color: #667eea;
        }

        .task-note {
            font-size: 0.9rem;
            color: #888;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .task-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .task-btn.done {
            background: #28a745;
            color: white;
        }

        .task-btn.delete {
            background: #dc3545;
            color: white;
        }

        .task-btn.edit {
            background: #17a2b8;
            color: white;
        }

        .task-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-footer .btn {
            flex: 1;
        }

        .sort-info {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sort-info i {
            color: #667eea;
        }

        .clear-all-btn {
            background: #dc3545 !important;
        }

        .clear-all-btn:hover {
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4) !important;
        }

        .check-box {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .quadrant-section {
            margin-top: 20px;
        }

        .quadrant-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .quadrant {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 20px;
            min-height: 300px;
            transition: all 0.3s;
            position: relative;
        }

        .quadrant.drag-over {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .quadrant-1 {
            border-top: 4px solid #dc3545;
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
        }

        .quadrant-2 {
            border-top: 4px solid #fd7e14;
            background: linear-gradient(135deg, #fffaf0 0%, #fff 100%);
        }

        .quadrant-3 {
            border-top: 4px solid #007bff;
            background: linear-gradient(135deg, #f8f9ff 0%, #fff 100%);
        }

        .quadrant-4 {
            border-top: 4px solid #6c757d;
            background: linear-gradient(135deg, #f8f9fa 0%, #fff 100%);
        }

        .quadrant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .quadrant-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .quadrant-count {
            background: rgba(0,0,0,0.1);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            color: #666;
        }

        .quadrant-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
        }

        .quadrant-tasks {
            min-height: 200px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.5);
        }

        .quadrant-task {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: grab;
            transition: all 0.2s;
            border-left: 3px solid;
        }

        .quadrant-task:active {
            cursor: grabbing;
            transform: scale(1.02);
        }

        .quadrant-task:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .quadrant-task-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .quadrant-task-meta {
            font-size: 0.8rem;
            color: #666;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quadrant-empty {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 任务清单管理</h1>
            <p>时间管理四象限 · 高效管理小猪的日常任务</p>
        </header>

        <div class="tabs">
            <button class="tab active" id="listTab">📝 任务列表</button>
            <button class="tab" id="quadrantTab">🎯 四象限视图</button>
        </div>

        <div class="main-content list-view" id="listView">
            <div class="card">
                <h2>➕ 添加新任务</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label>任务名称</label>
                        <input type="text" id="taskTitle" required placeholder="请输入任务名称">
                    </div>
                    <div class="form-group">
                        <label>开始时间</label>
                        <input type="datetime-local" id="startDateTime" required>
                    </div>
                    <div class="form-group">
                        <label>结束时间</label>
                        <input type="datetime-local" id="endDateTime" required>
                    </div>
                    <div class="form-group">
                        <label>重要程度</label>
                        <select id="priority" required>
                            <option value="">请选择重要程度</option>
                            <option value="high">🔴 重要</option>
                            <option value="medium">🟡 一般</option>
                            <option value="low">🟢 不太重要</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>紧急程度</label>
                        <select id="urgent" required>
                            <option value="">请选择紧急程度</option>
                            <option value="high">🔴 紧急</option>
                            <option value="low">🟢 不紧急</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="note" placeholder="添加备注信息..."></textarea>
                    </div>
                    <button type="submit" class="btn">添加任务</button>
                </form>
            </div>

            <div class="card">
                <div class="filter-section">
                    <h2>📅 任务列表</h2>
                    <div class="sort-info">
                        <i>🔄</i> 按结束时间自动排序
                    </div>
                    <div class="filter-row">
                        <input type="date" id="filterDate" placeholder="按开始日期筛选">
                        <select id="filterPriority">
                            <option value="">全部重要程度</option>
                            <option value="high">🔴 重要</option>
                            <option value="medium">🟡 一般</option>
                            <option value="low">🟢 不太重要</option>
                        </select>
                        <select id="filterStatus">
                            <option value="">全部状态</option>
                            <option value="pending">待完成</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-item">
                        <div class="number" id="totalCount">0</div>
                        <div class="label">总任务</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" id="pendingCount">0</div>
                        <div class="label">待完成</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" id="completedCount">0</div>
                        <div class="label">已完成</div>
                    </div>
                </div>

                <div class="task-list" id="taskList">
                    <div class="empty-state">
                        <i>📝</i>
                        <p>暂无任务，添加一个新任务吧！</p>
                    </div>
                </div>

                <button class="btn btn-secondary clear-all-btn" id="clearAllBtn" style="display: none;">清空所有任务</button>

                <div class="export-section" style="margin-top: 15px;">
                    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                        <label style="color: #666; font-size: 0.9rem;">选择导出日期：</label>
                        <input type="date" id="exportDate" style="padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
                        <button class="btn btn-secondary" id="exportExcelBtn" style="background: #28a745;">� 导出 Excel</button>
                    </div>
                    <div class="data-actions" style="display: flex; gap: 10px;">
                        <button class="btn btn-secondary" id="exportBtn" style="background: #17a2b8;">📥 导出 JSON</button>
                        <button class="btn btn-secondary" id="importBtn" style="background: #6c757d;">📤 导入数据</button>
                        <input type="file" id="importFile" accept=".json" style="display: none;">
                    </div>
                </div>
                
                <div class="storage-info" style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px; font-size: 0.85rem; color: #666; text-align: center;">
                    💾 数据自动保存到浏览器 | 建议定期导出备份
                </div>
            </div>
        </div>

        <div class="quadrant-view" id="quadrantView">
            <div class="quadrant-section">
                <div class="card" style="margin-bottom: 20px;">
                    <h2>🎯 时间管理四象限</h2>
                    <p style="color: #666; font-size: 0.95rem;">
                        四象限仅显示待完成任务，已完成任务不会显示在此处
                    </p>
                    <div style="display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="width: 12px; height: 12px; background: #dc3545; border-radius: 50%;"></span>
                            <span style="font-size: 0.9rem; color: #666;">重要且紧急</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="width: 12px; height: 12px; background: #fd7e14; border-radius: 50%;"></span>
                            <span style="font-size: 0.9rem; color: #666;">重要不紧急</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="width: 12px; height: 12px; background: #007bff; border-radius: 50%;"></span>
                            <span style="font-size: 0.9rem; color: #666;">紧急不重要</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="width: 12px; height: 12px; background: #6c757d; border-radius: 50%;"></span>
                            <span style="font-size: 0.9rem; color: #666;">不紧急不重要</span>
                        </div>
                    </div>
                </div>

                <div class="quadrant-grid">
                    <div class="quadrant quadrant-1" id="quadrant1" ondragover="allowDrop(event)" ondrop="dropTask(event, 'q1')">
                        <div class="quadrant-header">
                            <span class="quadrant-title">第一象限</span>
                            <span class="quadrant-count" id="q1Count">0</span>
                        </div>
                        <div class="quadrant-desc">🔥 重要且紧急</div>
                        <div class="quadrant-tasks" id="q1Tasks">
                            <div class="quadrant-empty">拖拽任务到这里</div>
                        </div>
                    </div>

                    <div class="quadrant quadrant-2" id="quadrant2" ondragover="allowDrop(event)" ondrop="dropTask(event, 'q2')">
                        <div class="quadrant-header">
                            <span class="quadrant-title">第二象限</span>
                            <span class="quadrant-count" id="q2Count">0</span>
                        </div>
                        <div class="quadrant-desc">⚡ 重要不紧急</div>
                        <div class="quadrant-tasks" id="q2Tasks">
                            <div class="quadrant-empty">拖拽任务到这里</div>
                        </div>
                    </div>

                    <div class="quadrant quadrant-3" id="quadrant3" ondragover="allowDrop(event)" ondrop="dropTask(event, 'q3')">
                        <div class="quadrant-header">
                            <span class="quadrant-title">第三象限</span>
                            <span class="quadrant-count" id="q3Count">0</span>
                        </div>
                        <div class="quadrant-desc">📣 紧急不重要</div>
                        <div class="quadrant-tasks" id="q3Tasks">
                            <div class="quadrant-empty">拖拽任务到这里</div>
                        </div>
                    </div>

                    <div class="quadrant quadrant-4" id="quadrant4" ondragover="allowDrop(event)" ondrop="dropTask(event, 'q4')">
                        <div class="quadrant-header">
                            <span class="quadrant-title">第四象限</span>
                            <span class="quadrant-count" id="q4Count">0</span>
                        </div>
                        <div class="quadrant-desc">💤 不紧急不重要</div>
                        <div class="quadrant-tasks" id="q4Tasks">
                            <div class="quadrant-empty">拖拽任务到这里</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2>✏️ 编辑任务</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>任务名称</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label>开始时间</label>
                    <input type="datetime-local" id="editStartDateTime" required>
                </div>
                <div class="form-group">
                    <label>结束时间</label>
                    <input type="datetime-local" id="editEndDateTime" required>
                </div>
                <div class="form-group">
                    <label>重要程度</label>
                    <select id="editPriority" required>
                        <option value="high">🔴 重要</option>
                        <option value="medium">🟡 一般</option>
                        <option value="low">🟢 不太重要</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>紧急程度</label>
                    <select id="editUrgent" required>
                        <option value="high">🔴 紧急</option>
                        <option value="low">🟢 不紧急</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="editNote"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="editCompleted" class="check-box"> 已完成
                    </label>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelEdit">取消</button>
                    <button type="submit" class="btn">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'todo_tasks';
        let draggedTaskId = null;

        function getTasks() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function getPriorityLabel(priority) {
            const labels = {
                high: '重要',
                medium: '一般',
                low: '不太重要'
            };
            return labels[priority] || '未知';
        }

        function getPriorityClass(priority) {
            return `priority-${priority}`;
        }

        function formatDateTime(dateTimeStr) {
            const date = new Date(dateTimeStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }

        function formatDate(dateTimeStr) {
            const date = new Date(dateTimeStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getQuadrant(priority, urgent) {
            const isImportant = priority === 'high';
            const isUrgent = urgent === 'high';
            
            if (isImportant && isUrgent) return 'q1';
            if (isImportant && !isUrgent) return 'q2';
            if (!isImportant && isUrgent) return 'q3';
            return 'q4';
        }

        function getQuadrantColor(quadrant) {
            const colors = {
                q1: '#dc3545',
                q2: '#fd7e14',
                q3: '#007bff',
                q4: '#6c757d'
            };
            return colors[quadrant] || '#6c757d';
        }

        function updateStats() {
            const tasks = getTasks();
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = pending;

            document.getElementById('clearAllBtn').style.display = total > 0 ? 'block' : 'none';
            updateQuadrantStats();
        }

        function updateQuadrantStats() {
            const tasks = getTasks().filter(t => !t.completed);
            const stats = { q1: 0, q2: 0, q3: 0, q4: 0 };
            
            tasks.forEach(task => {
                const quadrant = getQuadrant(task.priority, task.urgent);
                stats[quadrant]++;
            });

            document.getElementById('q1Count').textContent = stats.q1;
            document.getElementById('q2Count').textContent = stats.q2;
            document.getElementById('q3Count').textContent = stats.q3;
            document.getElementById('q4Count').textContent = stats.q4;
        }

        function renderTasks(filterDate = '', filterPriority = '', filterStatus = '') {
            const tasks = getTasks();
            
            const filtered = tasks.filter(task => {
                if (filterDate && formatDate(task.startDateTime) !== filterDate) return false;
                if (filterPriority && task.priority !== filterPriority) return false;
                if (filterStatus === 'completed' && !task.completed) return false;
                if (filterStatus === 'pending' && task.completed) return false;
                return true;
            });

            filtered.sort((a, b) => new Date(a.endDateTime) - new Date(b.endDateTime));

            const taskList = document.getElementById('taskList');
            
            if (filtered.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <i>📝</i>
                        <p>暂无符合条件的任务</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = filtered.map(task => `
                <div class="task-item important-${task.priority} ${task.completed ? 'completed' : ''}" draggable="true" ondragstart="dragStart(event, '${task.id}')" ondragend="dragEnd(event)">
                    <div class="task-header">
                        <span class="task-title">${task.title}</span>
                        <span class="task-priority ${getPriorityClass(task.priority)}">${getPriorityLabel(task.priority)}</span>
                    </div>
                    <div class="task-meta">
                        <span><i>📅</i> ${formatDateTime(task.startDateTime)} ~ ${formatDateTime(task.endDateTime)}</span>
                        <span><i>⚡</i> ${task.urgent === 'high' ? '紧急' : '不紧急'}</span>
                    </div>
                    ${task.note ? `<div class="task-note">📝 ${task.note}</div>` : ''}
                    <div class="task-actions">
                        <button class="task-btn done" onclick="toggleComplete('${task.id}')">
                            ${task.completed ? '撤销' : '完成'}
                        </button>
                        <button class="task-btn edit" onclick="openEditModal('${task.id}')">编辑</button>
                        <button class="task-btn delete" onclick="deleteTask('${task.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function renderQuadrants() {
            const tasks = getTasks().filter(t => !t.completed);
            const quadrants = { q1: [], q2: [], q3: [], q4: [] };

            tasks.forEach(task => {
                const quadrant = getQuadrant(task.priority, task.urgent);
                quadrants[quadrant].push(task);
            });

            Object.keys(quadrants).forEach(q => {
                const container = document.getElementById(`${q}Tasks`);
                const items = quadrants[q];

                if (items.length === 0) {
                    container.innerHTML = '<div class="quadrant-empty">拖拽任务到这里</div>';
                    return;
                }

                items.sort((a, b) => new Date(a.endDateTime) - new Date(b.endDateTime));

                container.innerHTML = items.map(task => `
                    <div class="quadrant-task" style="border-left-color: ${getQuadrantColor(q)};" draggable="true" ondragstart="dragStart(event, '${task.id}')" ondragend="dragEnd(event)">
                        <div class="quadrant-task-title">${task.title}</div>
                        <div class="quadrant-task-meta">
                            <span>📅 ${formatDateTime(task.endDateTime)}</span>
                            <span>${task.priority === 'high' ? '🔴' : task.priority === 'medium' ? '🟡' : '🟢'}</span>
                        </div>
                    </div>
                `).join('');
            });
        }

        function dragStart(event, taskId) {
            draggedTaskId = taskId;
            event.dataTransfer.effectAllowed = 'move';
            event.target.style.opacity = '0.5';
        }

        function dragEnd(event) {
            event.target.style.opacity = '1';
            draggedTaskId = null;
            
            document.querySelectorAll('.quadrant').forEach(q => {
                q.classList.remove('drag-over');
            });
        }

        function allowDrop(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            
            const quadrant = event.currentTarget;
            quadrant.classList.add('drag-over');
        }

        function dropTask(event, targetQuadrant) {
            event.preventDefault();
            
            const quadrant = event.currentTarget;
            quadrant.classList.remove('drag-over');

            if (!draggedTaskId) return;

            const tasks = getTasks();
            const taskIndex = tasks.findIndex(t => t.id === draggedTaskId);
            
            if (taskIndex === -1) return;

            const newPriority = targetQuadrant === 'q1' || targetQuadrant === 'q2' ? 'high' : 'low';
            const newUrgent = targetQuadrant === 'q1' || targetQuadrant === 'q3' ? 'high' : 'low';

            tasks[taskIndex].priority = newPriority;
            tasks[taskIndex].urgent = newUrgent;
            
            saveTasks(tasks);
            updateStats();
            renderTasks();
            renderQuadrants();
        }

        function addTask(e) {
            e.preventDefault();
            
            const task = {
                id: generateId(),
                title: document.getElementById('taskTitle').value,
                startDateTime: document.getElementById('startDateTime').value,
                endDateTime: document.getElementById('endDateTime').value,
                priority: document.getElementById('priority').value,
                urgent: document.getElementById('urgent').value,
                note: document.getElementById('note').value,
                completed: false,
                createdAt: new Date().toISOString()
            };

            const tasks = getTasks();
            tasks.push(task);
            saveTasks(tasks);

            document.getElementById('taskForm').reset();
            
            updateStats();
            renderTasks();
            renderQuadrants();
        }

        function toggleComplete(id) {
            const tasks = getTasks();
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks(tasks);
                updateStats();
                renderTasks();
                renderQuadrants();
            }
        }

        function deleteTask(id) {
            if (!confirm('确定要删除这个任务吗？')) return;
            
            const tasks = getTasks().filter(t => t.id !== id);
            saveTasks(tasks);
            updateStats();
            renderTasks();
            renderQuadrants();
        }

        function openEditModal(id) {
            const task = getTasks().find(t => t.id === id);
            if (!task) return;

            document.getElementById('editId').value = task.id;
            document.getElementById('editTitle').value = task.title;
            document.getElementById('editStartDateTime').value = task.startDateTime;
            document.getElementById('editEndDateTime').value = task.endDateTime;
            document.getElementById('editPriority').value = task.priority;
            document.getElementById('editUrgent').value = task.urgent;
            document.getElementById('editNote').value = task.note;
            document.getElementById('editCompleted').checked = task.completed;

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            document.getElementById('editForm').reset();
        }

        function editTask(e) {
            e.preventDefault();
            
            const id = document.getElementById('editId').value;
            const tasks = getTasks();
            const task = tasks.find(t => t.id === id);
            
            if (task) {
                task.title = document.getElementById('editTitle').value;
                task.startDateTime = document.getElementById('editStartDateTime').value;
                task.endDateTime = document.getElementById('editEndDateTime').value;
                task.priority = document.getElementById('editPriority').value;
                task.urgent = document.getElementById('editUrgent').value;
                task.note = document.getElementById('editNote').value;
                task.completed = document.getElementById('editCompleted').checked;
                
                saveTasks(tasks);
                closeEditModal();
                updateStats();
                renderTasks();
                renderQuadrants();
            }
        }

        function clearAllTasks() {
            if (!confirm('确定要清空所有任务吗？此操作不可恢复！')) return;
            saveTasks([]);
            updateStats();
            renderTasks();
            renderQuadrants();
        }

        function exportData() {
            const tasks = getTasks();
            const dataStr = JSON.stringify(tasks, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            const date = new Date();
            const filename = `tasks_backup_${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}.json`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            alert(`数据已导出！\n文件已保存为: ${filename}`);
        }

        function exportExcel() {
            const exportDate = document.getElementById('exportDate').value;
            let tasks = getTasks();
            
            if (exportDate) {
                tasks = tasks.filter(task => {
                    const taskDate = formatDate(task.startDateTime);
                    return taskDate === exportDate;
                });
            }

            if (tasks.length === 0) {
                alert('没有符合条件的任务可以导出！');
                return;
            }

            tasks.sort((a, b) => new Date(a.endDateTime) - new Date(b.endDateTime));

            const now = new Date();
            const dateStr = exportDate || `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
            
            let html = `
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head>
    <meta charset="UTF-8">
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #667eea; color: white; }
        .priority-high { background-color: #ffebee; }
        .priority-medium { background-color: #fff8e1; }
        .priority-low { background-color: #e8f5e9; }
        .completed { text-decoration: line-through; color: #999; }
    </style>
</head>
<body>
    <h2>📋 任务清单 - ${dateStr}</h2>
    <p>导出时间：${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}</p>
    <table>
        <tr>
            <th>任务名称</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>重要程度</th>
            <th>紧急程度</th>
            <th>状态</th>
            <th>备注</th>
        </tr>`;

            tasks.forEach(task => {
                const priorityLabel = getPriorityLabel(task.priority);
                const priorityClass = `priority-${task.priority}`;
                const statusLabel = task.completed ? '已完成' : '待完成';
                
                html += `
        <tr class="${priorityClass} ${task.completed ? 'completed' : ''}">
            <td>${task.title}</td>
            <td>${formatDateTime(task.startDateTime)}</td>
            <td>${formatDateTime(task.endDateTime)}</td>
            <td>${priorityLabel}</td>
            <td>${task.urgent === 'high' ? '紧急' : '不紧急'}</td>
            <td>${statusLabel}</td>
            <td>${task.note || '-'}</td>
        </tr>`;
            });

            html += `
    </table>
    <p style="margin-top: 20px; color: #666; font-size: 0.9rem;">总任务数：${tasks.length} | 待完成：${tasks.filter(t => !t.completed).length} | 已完成：${tasks.filter(t => t.completed).length}</p>
</body>
</html>`;

            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            const filename = `tasks_${exportDate || now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xls`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            alert(`Excel 已导出！\n文件已保存为: ${filename}`);
        }

        function importData() {
            document.getElementById('importFile').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedTasks = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(importedTasks)) {
                        throw new Error('数据格式不正确');
                    }

                    const confirmMsg = `即将导入 ${importedTasks.length} 个任务。\n\n注意：此操作将覆盖当前所有任务！\n确定继续吗？`;
                    if (!confirm(confirmMsg)) {
                        event.target.value = '';
                        return;
                    }

                    saveTasks(importedTasks);
                    updateStats();
                    renderTasks();
                    renderQuadrants();
                    alert(`成功导入 ${importedTasks.length} 个任务！`);
                } catch (error) {
                    alert('导入失败：' + error.message);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function applyFilters() {
            const date = document.getElementById('filterDate').value;
            const priority = document.getElementById('filterPriority').value;
            const status = document.getElementById('filterStatus').value;
            renderTasks(date, priority, status);
        }

        function switchToListView() {
            document.getElementById('listTab').classList.add('active');
            document.getElementById('quadrantTab').classList.remove('active');
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('quadrantView').classList.remove('active');
        }

        function switchToQuadrantView() {
            document.getElementById('quadrantTab').classList.add('active');
            document.getElementById('listTab').classList.remove('active');
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('quadrantView').classList.add('active');
            renderQuadrants();
        }

        function getDefaultDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        }

        function getDefaultEndDateTime() {
            const now = new Date();
            now.setHours(now.getHours() + 1);
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('startDateTime').value = getDefaultDateTime();
            document.getElementById('endDateTime').value = getDefaultEndDateTime();
            
            updateStats();
            renderTasks();

            document.getElementById('taskForm').addEventListener('submit', addTask);
            document.getElementById('editForm').addEventListener('submit', editTask);
            document.getElementById('closeModal').addEventListener('click', closeEditModal);
            document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
            document.getElementById('clearAllBtn').addEventListener('click', clearAllTasks);
            document.getElementById('listTab').addEventListener('click', switchToListView);
            document.getElementById('quadrantTab').addEventListener('click', switchToQuadrantView);
            
            document.getElementById('filterDate').addEventListener('change', applyFilters);
            document.getElementById('filterPriority').addEventListener('change', applyFilters);
            document.getElementById('filterStatus').addEventListener('change', applyFilters);

            document.getElementById('editModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('editModal')) {
                    closeEditModal();
                }
            });

            document.querySelectorAll('.quadrant').forEach(q => {
                q.addEventListener('dragleave', () => {
                    q.classList.remove('drag-over');
                });
            });

            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
            document.getElementById('importBtn').addEventListener('click', importData);
            document.getElementById('importFile').addEventListener('change', handleFileImport);
        });
    </script>
</body>
</html>
